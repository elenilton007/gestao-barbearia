# Blueprint do Render: o site no plano gratuito (Free), construído a
# partir do Dockerfile (Gunicorn). O banco é um PostgreSQL gratuito do
# Neon (https://neon.tech), informado na DATABASE_URL — o banco gratuito
# do próprio Render expira depois de um tempo; o do Neon não.
# Veja o passo a passo no README.
services:
  - type: web
    # Mesmo nome do serviço que já existe no Render: o Blueprint acha o
    # serviço pelo nome; com outro nome ele criaria um site novo.
    name: gestao-barbearia
    runtime: docker
    plan: free
    healthCheckPath: /login
    envVars:
      # Connection string do Neon. sync: false = o Render pede o valor no
      # painel, e a senha do banco não fica no repositório.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SEGURO
        value: "1"
      # O Render passa os pedidos por um proxy: assim o app enxerga o IP
      # verdadeiro de quem marca pelo link público (limite contra robôs).
      - key: ATRAS_DE_PROXY
        value: "1"
      # Primeiro dono, criado no deploy enquanto o banco não tem nenhum
      # usuário (o plano Free não tem terminal). Depois são ignoradas.
      - key: DONO_USUARIO
        sync: false
      - key: DONO_SENHA
        sync: false
      - key: BARBEARIA_NOME
        sync: false
      # Cobrança da assinatura pelo Asaas (veja assinatura.py e o README).
      # A chave e o token são segredos: preenchidos no painel do Render.
      - key: ASAAS_API_KEY
        sync: false
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false
      - key: ASAAS_URL
        value: https://api.asaas.com/v3
      - key: PLANO_VALOR
        value: "49.90"
      # Dias grátis da conta nova; depois trava até pagar (0 = paga no cadastro).
      - key: TESTE_DIAS
        value: "7"
      # 0 = ninguém é bloqueado; mude para 1 quando o Asaas estiver pronto.
      - key: COBRANCA_ATIVA
        value: "0"
      # 1 = pede a antecipação de cada pagamento de cartão (cai em até 2 dias úteis).
      - key: ANTECIPAR_CARTAO
        value: "1"
      # WhatsApp de vendas mostrado na página inicial (ex.: 71988112040).
      - key: CONTATO_WHATSAPP
        sync: false
