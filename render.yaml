# Blueprint do Render: cria o site (web service no plano Free, a partir do
# Dockerfile, com o Gunicorn). O banco é um PostgreSQL gratuito do Neon,
# informado na variável DATABASE_URL. Veja o passo a passo no README.
#
# O PostgreSQL gratuito do próprio Render expira depois de um tempo; o do
# Neon não expira, por isso o banco fica no Neon.
services:
  - type: web
    name: gestao-barbearia
    runtime: docker
    plan: free
    branch: main
    autoDeploy: true
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        sync: false  # o Render pede no painel: cole a connection string do Neon
      - key: SECRET_KEY
        generateValue: true  # o Render gera uma chave aleatória
      - key: COOKIE_SEGURO
        value: "1"
      - key: DONO_USUARIO
        sync: false  # login do primeiro dono (só usado com o banco sem usuários)
      - key: DONO_SENHA
        sync: false  # senha do primeiro dono (mínimo de 8 caracteres)
      - key: BARBEARIA_NOME
        sync: false  # nome da barbearia do primeiro dono (opcional)
