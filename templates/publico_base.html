<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#103B31">
    <meta name="robots" content="{% block robots %}index{% endblock %}">
    <title>{% block titulo %}{{ barbearia.nome }}{% endblock %}</title>
    <meta name="description" content="Marque seu horário na {{ barbearia.nome }} pelo celular.">
    <link rel="preload" href="{{ url_for('static', filename='fontes/gloock-latin-400-normal.woff2') }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="publico">
    <header class="pub-topo">
        <div class="pub-largura">
            <a class="pub-nome" href="{{ url_for('pagina_publica', slug=barbearia.slug) }}">{{ barbearia.nome }}</a>
            {% if barbearia.whatsapp %}
            <a class="pub-whats" href="https://wa.me/55{{ barbearia.whatsapp|replace('(', '')|replace(')', '')|replace(' ', '')|replace('-', '') }}" rel="noopener">Falar no WhatsApp</a>
            {% endif %}
        </div>
    </header>
    <main class="pub-largura pub-conteudo">
        {% for categoria, mensagem in get_flashed_messages(with_categories=true) %}
        <p class="alerta {{ {'ok': 'sucesso', 'aviso': 'aviso'}.get(categoria, '') }}" role="alert">{{ mensagem }}</p>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
    <footer class="pub-rodape pub-largura">
        <a href="{{ url_for('privacidade_publica', slug=barbearia.slug) }}">Como usamos seus dados</a>
        <span>Agenda feita com MeuBarber</span>
    </footer>
</body>
</html>
