{% extends "base.html" %}

{% block titulo %}Trocar senha{% endblock %}

{% block content %}
<div class="conteudo-estreito">
<header class="cabecalho">
    <div>
        <h1>Trocar senha</h1>
        <p>Os outros aparelhos em que você está conectado saem na hora.</p>
    </div>
</header>

<section class="painel">
    <form method="POST" action="{{ url_for('trocar_senha') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="campo">
            <label for="senha_atual">Senha atual</label>
            <input type="password" id="senha_atual" name="senha_atual" autocomplete="current-password" required autofocus>
        </div>
        <div class="campo">
            <label for="nova_senha">Nova senha (pelo menos 8 caracteres)</label>
            <input type="password" id="nova_senha" name="nova_senha" autocomplete="new-password" minlength="8" required>
        </div>
        <div class="campo">
            <label for="confirmacao">Repita a nova senha</label>
            <input type="password" id="confirmacao" name="confirmacao" autocomplete="new-password" minlength="8" required>
        </div>
        <button type="submit">Salvar nova senha</button>
    </form>
</section>
</div>
{% endblock %}
