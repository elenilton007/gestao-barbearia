{% extends "base.html" %}

{% block titulo %}{{ usuario.usuario }}{% endblock %}

{% block content %}
<div class="conteudo-estreito">
<a class="voltar" href="{{ url_for('usuarios') }}">Voltar para Usuários</a>
<header class="cabecalho"><h1>{{ usuario.usuario }}</h1></header>

<section class="painel">
    <form method="POST" action="{{ url_for('editar_usuario', usuario_id=usuario.id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="grade-campos">
            <div class="campo">
                <label for="papel">Papel</label>
                <select id="papel" name="papel">
                    {% for papel in papeis %}
                    <option value="{{ papel }}" {{ "selected" if papel == usuario.papel }}>{{ papel }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="campo">
                <label for="barbeiro_id">Barbeiro vinculado</label>
                <select id="barbeiro_id" name="barbeiro_id">
                    <option value="">Nenhum</option>
                    {% for barbeiro in barbeiros %}
                    <option value="{{ barbeiro.id }}" {{ "selected" if barbeiro.id == usuario.barbeiro_id }}>{{ barbeiro.nome }}{{ "" if barbeiro.ativo else " (desativado)" }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="campo">
            <label for="nova_senha">Nova senha</label>
            <input type="password" id="nova_senha" name="nova_senha" minlength="8" autocomplete="new-password">
            <p class="dica">Deixe em branco para manter a senha atual.</p>
        </div>
        <button type="submit">Salvar alterações</button>
    </form>
</section>
</div>
{% endblock %}
