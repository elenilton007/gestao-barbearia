{% extends "base.html" %}

{% block content %}
<h2>✂️ Editar Serviço</h2>

<div class="card">
    <h3>{{ servico.nome }}</h3>
    <form method="POST" action="{{ url_for('editar_servico', servico_id=servico.id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" value="{{ servico.nome }}" required>

        <label for="preco">Preço (R$):</label>
        <input type="number" step="0.01" min="0" id="preco" name="preco"
               value="{{ servico.preco }}" required>

        <label for="duracao_minutos">Duração (minutos):</label>
        <input type="number" step="1" min="1" id="duracao_minutos"
               name="duracao_minutos" value="{{ servico.duracao_minutos }}" required>
        <p class="dica">Mudar o preço não altera o valor cobrado nos atendimentos
            já registrados.</p>

        <button type="submit">Salvar</button>
    </form>
    <p><a href="{{ url_for('servicos') }}">Voltar</a></p>
</div>
{% endblock %}
