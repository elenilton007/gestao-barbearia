{% extends "base.html" %}

{% block titulo %}{{ servico.nome }}{% endblock %}

{% block content %}
<div class="conteudo-estreito">
<a class="voltar" href="{{ url_for('servicos') }}">Voltar para Serviços</a>
<header class="cabecalho"><h1>{{ servico.nome }}</h1></header>

<section class="painel">
    <form method="POST" action="{{ url_for('editar_servico', servico_id=servico.id) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="campo">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" value="{{ servico.nome }}" required>
        </div>
        <div class="grade-campos">
            <div class="campo">
                <label for="preco">Preço (R$)</label>
                <input type="number" step="0.01" min="0" id="preco" name="preco" value="{{ servico.preco }}" inputmode="decimal" required>
            </div>
            <div class="campo">
                <label for="duracao_minutos">Duração (min)</label>
                <input type="number" step="1" min="1" id="duracao_minutos" name="duracao_minutos" value="{{ servico.duracao_minutos }}" inputmode="numeric" required>
            </div>
        </div>
        <p class="dica">Mudar o preço não altera atendimentos já registrados nem horários já marcados.</p>
        <button type="submit">Salvar alterações</button>
    </form>
</section>
</div>
{% endblock %}
